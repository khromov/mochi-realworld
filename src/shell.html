<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link
      href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="/conduit-theme.css" />

    <style>
      html {
        scrollbar-gutter: stable;
      }

      .navbar {
        view-transition-name: conduit-navbar;
      }
      .home-page .banner {
        view-transition-name: conduit-home-banner;
      }
      .profile-page .user-info {
        view-transition-name: conduit-profile-header;
      }

      ::view-transition-group(conduit-navbar),
      ::view-transition-group(conduit-home-banner),
      ::view-transition-group(conduit-profile-header) {
        animation: none;
      }
      ::view-transition-old(conduit-navbar),
      ::view-transition-old(conduit-home-banner),
      ::view-transition-old(conduit-profile-header) {
        display: none;
      }
      ::view-transition-new(conduit-navbar),
      ::view-transition-new(conduit-home-banner),
      ::view-transition-new(conduit-profile-header) {
        animation: none;
      }

      @keyframes conduit-vt-fade-out {
        to {
          opacity: 0;
        }
      }
      @keyframes conduit-vt-fade-in {
        from {
          opacity: 0;
        }
      }

      ::view-transition-old(conduit-navbar):only-child,
      ::view-transition-old(conduit-home-banner):only-child,
      ::view-transition-old(conduit-profile-header):only-child {
        display: block;
        animation: conduit-vt-fade-out 180ms ease both;
      }
      ::view-transition-new(conduit-navbar):only-child,
      ::view-transition-new(conduit-home-banner):only-child,
      ::view-transition-new(conduit-profile-header):only-child {
        animation: conduit-vt-fade-in 180ms ease both;
      }
    </style>

    {{mochi.head}} {{mochi.css}}
  </head>
  <body>
    {{mochi.body}} {{mochi.script}}
  </body>
</html>
