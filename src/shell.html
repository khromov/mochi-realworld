<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Import Ionicon icons & Google Fonts our Bootstrap theme relies on -->
    <link
      href="//code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="//fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <!--
      The custom Bootstrap 4 theme. The reference app links //demo.productionready.io/main.css, but
      that CDN now 404s (the upstream demo is unstyled because of it), so the original stylesheet is
      vendored into public/ and served locally.
    -->
    <link rel="stylesheet" href="/main.css" />

    <style>
      /*
        Always reserve the scrollbar gutter. RealWorld's `.container` is a fixed 1140px centred with
        auto margins, so a page that scrolls and a page that doesn't differ in viewport width by the
        scrollbar (~15px), sliding the navbar 7.5px sideways between routes. Harmless on its own, but
        the cross-document view transition snapshots the navbar and the shift becomes a visible jump.
      */
      html {
        scrollbar-gutter: stable;
      }
    </style>

    {{mochi.head}} {{mochi.css}}
  </head>
  <body>
    {{mochi.body}} {{mochi.script}}
    <!--
      Speculation Rules: the browser speculatively loads the link the user is about to click, so a
      full page load lands instantly. Document rules (`where` + `eagerness`) mean no per-page
      bookkeeping — they follow whatever links are on the page. Inert in browsers without support.

      Every mutation in this app is a POST, and speculation only ever issues GETs from <a href>, so
      nothing here can trigger a side effect. `href_matches: "/*"` is same-origin only.
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/_*" } },
                { "not": { "selector_matches": "[target=_blank]" } },
                { "not": { "selector_matches": "[rel~=nofollow]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ],
        "prerender": [
          {
            "where": {
              "and": [
                {
                  "or": [
                    { "href_matches": "/" },
                    { "href_matches": "/article/*" },
                    { "href_matches": "/profile/*" }
                  ]
                },
                { "not": { "selector_matches": "[target=_blank]" } },
                { "not": { "selector_matches": "[rel~=nofollow]" } }
              ]
            },
            "eagerness": "conservative"
          }
        ]
      }
    </script>
  </body>
</html>
